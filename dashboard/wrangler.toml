# Cloudflare Pages project for the admin dashboard (stream.wzrd.tech).
#
#   npm run pages:build      # next build + @cloudflare/next-on-pages -> .vercel/output/static
#   npm run pages:preview    # run the built output locally with wrangler
#   npm run pages:deploy     # wrangler pages deploy
#
# Non-secret vars live under [vars]. Secrets (FAL_KEY, TWITCH_CLIENT_SECRET) must NOT be
# committed: set them with `wrangler pages secret put <NAME>` or in the Pages dashboard
# (Settings -> Environment variables) for both Production and Preview.

name = "5dee-tv-admin"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
pages_build_output_dir = ".vercel/output/static"

# Plain variables live in [vars]: `wrangler pages deploy` (direct upload) wipes
# plain-text vars previously set on the Pages project, so they must be re-supplied
# on every deploy. Secrets are the opposite — project-level `secret_text` vars
# survive deploys, so FAL_KEY etc. stay in the Pages project settings.
[vars]
NEXT_PUBLIC_CONVEX_URL = "https://sleek-opossum-939.convex.cloud"
TWITCH_CHANNEL = "510coast"
TWITCH_CLIENT_ID = "wjx7dlnw7o242psisgylakohajg5z2"
CF_ACCESS_TEAM_DOMAIN = "shrill-cherry-ba30.cloudflareaccess.com"
CF_ACCESS_AUD = "6ecad68b7fdd6831f29a5c8e622edfb8c827c9e1854401eb480657c7732765dd"
GMI_COORDINATOR_MODEL = "openai/gpt-6-astra"
GMI_WORKER_MODEL = "zai-org/GLM-5.3-Flash"

# NEXT_PUBLIC_* values are also inlined into the client bundle at BUILD time, so
# .env.production carries the same NEXT_PUBLIC_CONVEX_URL — without it a clean
# `pages:build` compiles Convex off even though the binding below is present.
#
# Optional plain vars:
#   NEXT_PUBLIC_FAL_API_URL   public URL of the deployed fal streaming app
#                             (add to .env.production too — same build-time inline)
#
# Cloudflare Pages secrets (set in the Pages project, or via
# `wrangler pages secret put <NAME>`):
#   FAL_KEY
#   TWITCH_CLIENT_SECRET
#
# GMI runs in Convex, so its secrets belong in the Convex production
# deployment, not Pages. Set them without placing values in git or the shell
# history, for example:
#   pbpaste | npx convex env set GMI_CLOUD_API_KEY --deployment prod
#   pbpaste | npx convex env set GMI_CLOUD_ORGANIZATION_ID --deployment prod
#
# Auth for /admin and /api (middleware.ts). Production fails closed (401) unless one is set:
#   a) verify Cloudflare Access JWTs at the origin (recommended): the CF_ACCESS_* vars above
#   b) trust the edge (Access app covering /admin* and /api*) and skip verification
#        ADMIN_AUTH_MODE = edge-only
