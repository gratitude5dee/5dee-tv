# Cloudflare Pages project for the admin dashboard (stream.wzrd.tech).
#
#   npm run pages:build      # next build + @cloudflare/next-on-pages -> .vercel/output/static
#   npm run pages:preview    # run the built output locally with wrangler
#   npm run pages:deploy     # wrangler pages deploy
#
# Non-secret vars live under [vars]. Secrets (FAL_KEY, TWITCH_CLIENT_SECRET) must NOT be
# committed: set them with `wrangler pages secret put <NAME>` or in the Pages dashboard
# (Settings -> Environment variables) for both Production and Preview.

name = "5dee-tv-admin"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# No [vars] block: values set here override the Pages project's environment
# variables on every deploy, so all configuration lives in the Pages project
# (Settings -> Environment variables, or `wrangler pages secret put <NAME>`).
#
# Plain variables:
#   NEXT_PUBLIC_FAL_API_URL   public URL of the deployed fal streaming app
#   NEXT_PUBLIC_CONVEX_URL    Convex deployment URL (build-time; also needed in the build env)
#   TWITCH_CHANNEL            channel login, lowercase (NEXT_PUBLIC_TWITCH_CHANNEL also works)
#   TWITCH_CLIENT_ID          Twitch app client ID (public identifier)
#
# Secrets:
#   FAL_KEY
#   TWITCH_CLIENT_SECRET
#
# Auth for /admin and /api (middleware.ts). Production fails closed (401) unless one is set:
#   a) verify Cloudflare Access JWTs at the origin (recommended)
#        CF_ACCESS_TEAM_DOMAIN = <yourteam>.cloudflareaccess.com
#        CF_ACCESS_AUD         = application audience tag (Zero Trust -> Access -> Applications)
#   b) trust the edge (Access app covering /admin* and /api*) and skip verification
#        ADMIN_AUTH_MODE = edge-only
